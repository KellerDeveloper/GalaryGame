# XcodeGen spec — generate GalaryGame.xcodeproj with:  xcodegen generate
# Install XcodeGen:  brew install xcodegen
name: GalaryGame
options:
  bundleIdPrefix: com.kellerdeveloper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # <- set your Apple Developer Team ID in Xcode
    GENERATE_INFOPLIST_FILE: NO

targets:
  GalaryGame:
    type: application
    platform: iOS
    sources:
      - path: GalaryGame
    settings:
      base:
        INFOPLIST_FILE: GalaryGame/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kellerdeveloper.galarygame
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1" # iPhone
    dependencies: []

  GalaryGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GalaryGameTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellerdeveloper.galarygame.tests
    dependencies:
      - target: GalaryGame
