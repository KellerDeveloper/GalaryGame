# XcodeGen spec — generate TrashPanda.xcodeproj with:  xcodegen generate
# Install XcodeGen:  brew install xcodegen
name: TrashPanda
options:
  bundleIdPrefix: com.kellerdeveloper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # <- set your Apple Developer Team ID in Xcode
    GENERATE_INFOPLIST_FILE: NO

targets:
  TrashPanda:
    type: application
    platform: iOS
    sources:
      - path: TrashPanda
    settings:
      base:
        INFOPLIST_FILE: TrashPanda/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kellerdeveloper.trashpanda
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
    dependencies: []
    scheme:
      testTargets:
        - TrashPandaTests
      gatherCoverageData: true

  TrashPandaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrashPandaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellerdeveloper.trashpanda.tests
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
    dependencies:
      - target: TrashPanda
